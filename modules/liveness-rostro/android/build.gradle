buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.uniride'
version = '0.1.0'

android {
  namespace "expo.modules.livenessrostro"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  buildFeatures {
    compose true
  }
  compileOptions {
    // El componente de AWS usa APIs de Java 8 (java.time) que Android 7 no trae.
    coreLibraryDesugaringEnabled true
  }
}

dependencies {
  // Componente oficial de Face Liveness (AGENTS.md §4). Con credenciales propias no hace falta Amplify Auth.
  implementation 'com.amplifyframework.ui:liveness:1.13.0'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  // La actividad usa Compose y el contrato de permisos directamente: no basta con lo que trae el componente de AWS.
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.compose.material3:material3:1.3.1'
}
